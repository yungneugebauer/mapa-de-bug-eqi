<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mapa de Bugs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Aeonik (fonte base do EQI DS) é proprietária e não está disponível via CDN público.
     Declaramos ela primeiro na pilha de fontes (usa se estiver instalada localmente)
     e carregamos Inter como substituta neutra mais próxima. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- EQI DS · Cores semânticas (Modes) ---- */
    --bg-primary: #ffffff;
    --bg-secondary: #f5f5f5;
    --bg-tertiary: #e0e0e0;
    --bg-brand: #004031;
    --bg-brand-light: #f2f5f4;

    --content-primary: #141414;
    --content-secondary: #585858;
    --content-tertiary: #7f7f7f;
    --content-always-light: #ffffff;
    --content-brand: #004031;

    --border-primary: #9c9c9c;
    --border-secondary: #cdcdcd;
    --border-brand: #005d47;

    --focus-ring-brand: #009e76;
    --hover-brand: #009e76;
    --active-brand-light: #00c796;
    --disabled-bg: #cdcdcd;
    --disabled-content: #7f7f7f;
    --focus-ring-error: #ea4b4b;

    --alert-success: #005d47;
    --alert-error: #c43636;

    /* Severidade — cores definidas pelo time */
    --sev-bloqueante: #B5423D;
    --sev-alta: #183F32;
    --sev-media: #469C79;
    --sev-baixa: #B1D4C7;
    --sev-baixa-text: #183F32;
    --tint-error: rgba(196,54,54,0.10);
    --tint-success: rgba(0,93,71,0.10);
    --tint-brand: rgba(0,158,118,0.14);

    /* ---- EQI DS · Forma (Shape) ---- */
    --radius-2xs: 4px;   /* botões, inputs, badges, tags, cards padrão */
    --radius-xs: 8px;    /* cards maiores, modais */
    --radius-xl: 24px;   /* pills */

    /* ---- EQI DS · Tipografia (escala real, fonte Aeonik) ---- */
    --fs-h4: 32px; --lh-h4: 44px;
    --fs-h5: 24px; --lh-h5: 32px;
    --fs-h6: 20px; --lh-h6: 28px;
    --fs-label-xl: 16px; --lh-label-xl: 24px;
    --fs-label-l: 14px;  --lh-label-l: 20px;
    --fs-label-m: 12px;  --lh-label-m: 16px;
    --fs-label-s: 10px;  --lh-label-s: 12px;
    --fs-p-l: 14px; --lh-p-l: 24px;
    --fs-p-m: 12px; --lh-p-m: 20px;
    --fs-p-s: 10px; --lh-p-s: 16px;

    --shadow: 0 1px 2px rgba(20,20,20,0.05), 0 4px 14px rgba(20,20,20,0.06);
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg-primary);
    color: var(--content-primary);
    font-family: 'Aeonik', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: var(--fs-p-l);
    line-height: 1.5;
  }
  ::selection{ background: var(--tint-brand); }
  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width: 290px;
    flex-shrink:0;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border-secondary);
    padding: 22px 18px 18px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; margin-bottom: 4px; }
  .brand-mark{
    font-size: var(--fs-label-m);
    font-weight: 600;
    color: var(--content-always-light);
    background: var(--bg-brand);
    border: 1px solid var(--bg-brand);
    padding: 2px 7px;
    border-radius: var(--radius-2xs);
  }
  h1.title{
    font-weight: 500;
    font-size: var(--fs-h6);
    line-height: var(--lh-h6);
    margin:0;
    color: var(--content-primary);
  }
  .subtitle{
    font-size: var(--fs-label-m);
    line-height: var(--lh-label-m);
    color: var(--content-secondary);
    margin: 0 0 6px;
  }
  .reporter-row{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding-bottom:12px;
    border-bottom: 1px solid var(--border-secondary);
  }
  .reporter-row.no-divider{ border-bottom: none; padding-bottom: 0; }
  .sidebar-divider{ border-bottom: 1px solid var(--border-secondary); margin: 4px 0; }
  .reporter-row label{
    font-size: var(--fs-label-m);
    font-weight: 600;
    color: var(--content-secondary);
  }
  input, select, textarea{
    font-family: inherit;
    font-size: var(--fs-label-l);
    color: var(--content-primary);
    background: var(--bg-primary);
    border: 1px solid var(--border-secondary);
    border-radius: var(--radius-2xs);
    padding: 9px 11px;
    outline: none;
  }
  select{
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23004031' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 11px center;
    background-size: 13px 13px;
    padding-right: 32px;
  }
  input:focus, select:focus, textarea:focus{
    border-color: var(--focus-ring-brand);
    box-shadow: 0 0 0 3px var(--tint-brand);
  }
  .comp-search{ width:100%; }
  .comp-list{
    list-style:none;
    margin:0; padding:0;
    overflow-y:auto;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .comp-item{
    display:flex;
    align-items:center;
    gap:6px;
    padding: 9px 10px;
    border-radius: var(--radius-2xs);
    cursor:pointer;
    border: 1px solid transparent;
  }
  .comp-item:hover{ background: var(--bg-primary); }
  .comp-item.active{
    background: var(--bg-primary);
    border-color: var(--border-secondary);
    box-shadow: var(--shadow);
  }
  .comp-name{
    flex:1;
    min-width:0;
    font-size: var(--fs-label-l);
    font-weight: 500;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .comp-count{
    font-size: var(--fs-label-s);
    font-weight:600;
    padding: 2px 7px;
    border-radius: var(--radius-2xs);
    background: var(--tint-error);
    color: var(--alert-error);
    flex-shrink:0;
  }
  .comp-count.zero{ background: var(--tint-success); color: var(--alert-success); }
  .empty-comps{ color: var(--content-secondary); font-size: var(--fs-label-m); padding: 10px 2px; }

  /* ---------- Button (variantes do DS) ---------- */
  .btn{
    font-family: inherit;
    font-size: var(--fs-label-l);
    font-weight: 600;
    border-radius: var(--radius-2xs);
    border: 1px solid var(--bg-brand);
    background: var(--bg-brand);
    color: var(--content-always-light);
    padding: 10px 16px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .btn:hover{ background: var(--hover-brand); border-color: var(--hover-brand); }
  .btn.secondary{
    /* Button variant=outline */
    background: transparent;
    color: var(--content-brand);
    border-color: var(--content-brand);
  }
  .btn.secondary:hover{ background: var(--bg-brand-light); }
  .btn.small{ font-size: var(--fs-label-m); padding: 6px 11px; }
  .btn.danger{
    /* Button variant=naked, com cor de alert/error para ação destrutiva */
    background: transparent;
    color: var(--alert-error);
    border-color: transparent;
    padding-left: 8px;
    padding-right: 8px;
  }
  .btn.danger:hover{ background: var(--tint-error); }
  .btn.danger.confirming{
    background: var(--alert-error);
    color: var(--content-always-light);
    border-color: var(--alert-error);
  }
  .btn.danger.confirming:hover{ background: var(--alert-error); }
  .btn.danger-solid{
    background: var(--alert-error);
    border-color: var(--alert-error);
    color: var(--content-always-light);
  }
  .btn.danger-solid:hover{ background: #a92e2e; border-color: #a92e2e; }
  .delete-warning-text{ font-size: var(--fs-p-m); color: var(--content-secondary); margin: 0 0 14px; }
  .btn.block{ width:100%; justify-content:center; }

  /* ---------- Main ---------- */
  .main{ flex:1; padding: 26px 34px 60px; overflow-y:auto; }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 22px;
    gap:12px;
    flex-wrap:wrap;
  }
  .page-heading{
    font-size: var(--fs-h6);
    line-height: var(--lh-h6);
    font-weight: 500;
    color: var(--content-primary);
    margin: 0;
  }
  .page-heading-row{ display:flex; align-items:center; gap:10px; }
  .page-del-inline{
    background:none;
    border:none;
    color: var(--content-tertiary);
    cursor:pointer;
    padding: 4px;
    display:inline-flex;
    align-items:center;
    border-radius: var(--radius-2xs);
  }
  .page-del-inline:hover{ color: var(--alert-error); background: var(--tint-error); }

  .icon{ display:inline-flex; flex-shrink:0; }

  .empty-state{
    border: 1px solid var(--border-secondary);
    border-radius: var(--radius-xs);
    padding: 40px 30px;
    text-align:center;
    color: var(--content-secondary);
    background: var(--bg-secondary);
  }
  .empty-state h2{
    color: var(--content-primary);
    font-size: var(--fs-h5);
    line-height: var(--lh-h5);
    font-weight: 500;
    margin: 0 0 8px;
  }
  .empty-icon{ color: var(--content-tertiary); margin-bottom: 10px; }

  /* ---------- Card de bug ---------- */
  .bug-card{
    background: var(--bg-secondary);
    border: 1px solid var(--border-secondary);
    border-left: 4px solid var(--sev-media); /* cor sobrescrita pela classe de severidade abaixo */
    border-radius: var(--radius-xs);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .bug-card.sev-bloqueante{ border-left-color: var(--sev-bloqueante); }
  .bug-card.sev-alta{ border-left-color: var(--sev-alta); }
  .bug-card.sev-media{ border-left-color: var(--sev-media); }
  .bug-card.sev-baixa{ border-left-color: var(--sev-baixa); }
  .bug-card.status-resolvido{ opacity: 0.7; }
  .bug-card.status-nao-existente{ opacity: 0.6; }
  .bug-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .bug-title-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .bug-title{ font-weight: 600; font-size: var(--fs-label-xl); cursor:pointer; color: var(--content-primary); }

  /* ---------- Badge (radius/2xs, variantes solid/subtle/outline) ---------- */
  .badge{
    font-size: var(--fs-label-m);
    font-weight: 600;
    padding: 2px 8px;
    border-radius: var(--radius-2xs);
    line-height: var(--lh-label-m);
  }
  /* Severidade: DS não define hierarquia própria de severidade — adaptamos
     usando os dois tons semânticos existentes (alert/error e neutros) em
     pesos decrescentes: solid > outline-error > subtle > outline. */
  .badge.sev-bloqueante{ background: var(--sev-bloqueante); color: var(--content-always-light); }
  .badge.sev-alta{ background: var(--sev-alta); color: var(--content-always-light); }
  .badge.sev-media{ background: var(--sev-media); color: var(--content-always-light); }
  .badge.sev-baixa{ background: var(--sev-baixa); color: var(--sev-baixa-text); }

  .bug-meta{ font-size: var(--fs-label-s); color: var(--content-tertiary); margin-top: 3px; }
  .bug-actions{ display:flex; gap:6px; align-items:center; flex-shrink:0; }
  .bug-body{
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border-secondary);
    font-size: var(--fs-p-l);
    display:none;
  }
  .bug-body.open{ display:block; }
  .bug-body p{ margin: 0 0 8px; white-space: pre-wrap; color: var(--content-primary); }
  .bug-body .field-label{
    font-size: var(--fs-label-m);
    font-weight:600;
    color: var(--content-secondary);
    margin-bottom:2px;
  }

  .form-panel{
    background: var(--bg-secondary);
    border: 1px solid var(--border-secondary);
    border-radius: var(--radius-xs);
    padding: 18px;
    margin-bottom: 18px;
    display:none;
  }
  .form-panel.open{ display:block; }
  .form-panel h3{
    font-size: var(--fs-h6);
    line-height: var(--lh-h6);
    font-weight: 500;
    margin: 0 0 14px;
    color: var(--content-primary);
  }
  .form-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .form-grid .full{ grid-column: 1 / -1; }
  .form-field label{
    display:block;
    font-size: var(--fs-label-m);
    font-weight:600;
    color: var(--content-secondary);
    margin-bottom: 5px;
  }
  .form-field input, .form-field select, .form-field textarea{ width:100%; }
  textarea{ resize: vertical; min-height: 60px; }
  input[type="file"]{
    padding: 6px 8px;
    font-size: var(--fs-p-m);
    background: var(--bg-primary);
  }
  .img-preview{ margin-top: 8px; display:none; }
  .img-preview.show{ display:flex; align-items:flex-end; gap:10px; }
  .img-preview img{
    max-width: 120px;
    max-height: 90px;
    object-fit: cover;
    border-radius: var(--radius-2xs);
    border: 1px solid var(--border-secondary);
  }
  .img-preview-remove{
    background:none;
    border:none;
    color: var(--alert-error);
    font-size: var(--fs-label-m);
    font-weight:600;
    cursor:pointer;
    padding: 4px 0;
  }
  .bug-image-attachment{ margin-top: 10px; cursor: zoom-in; }
  .bug-image-attachment img{
    max-width: 100%;
    max-height: 320px;
    object-fit: contain;
    border-radius: var(--radius-2xs);
    border: 1px solid var(--border-secondary);
    cursor: zoom-in;
    display:block;
  }

  /* dup-warning estilizado como Alert status=info (bg brand-light) */
  .dup-warning{
    margin-top: 12px;
    padding: 12px 14px;
    background: var(--bg-brand-light);
    border-radius: var(--radius-2xs);
    font-size: var(--fs-p-m);
    color: var(--content-primary);
    display:none;
  }
  .dup-warning.show{ display:block; }
  .dup-warning strong{ display:block; margin-bottom: 6px; color: var(--content-brand); font-weight:600; }
  .dup-item{ padding: 5px 0; border-bottom: 1px solid rgba(20,20,20,0.08); cursor:pointer; }
  .dup-item:last-child{ border-bottom:none; }
  .form-actions{ margin-top: 16px; display:flex; gap: 8px; }

  .format-chip-bar{ display:flex; gap:8px; margin-bottom: 14px; }
  .fmt-chip-btn{
    font-family: inherit;
    font-size: var(--fs-label-l);
    font-weight: 600;
    color: var(--content-secondary);
    background: var(--bg-secondary);
    border: 1px solid var(--border-secondary);
    border-radius: var(--radius-2xs);
    padding: 7px 14px;
    cursor:pointer;
  }
  .fmt-chip-btn:hover{ border-color: var(--content-brand); color: var(--content-brand); }
  .fmt-chip-btn.active{ background: var(--content-brand); border-color: var(--content-brand); color: var(--content-always-light); }
  .fmt-chip-btn b{ font-weight:700; }

  .all-bugs-filters{ display:flex; gap:8px; margin-bottom: 16px; flex-wrap:wrap; }
  .all-bugs-filters select, .all-bugs-filters input{ font-size: var(--fs-p-m); }
  .comp-tag{ font-size: var(--fs-label-s); font-weight:600; color: var(--content-tertiary); margin-bottom: 3px; }

  .modal-overlay{
    position:fixed; inset:0;
    background: rgba(20,20,20,0.42);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 50;
    padding: 20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background: var(--bg-primary);
    border: 1px solid var(--border-secondary);
    border-radius: var(--radius-xs);
    padding: 22px;
    max-width: 420px;
    width:100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 10px 40px rgba(20,20,20,0.22);
  }
  .modal-box h3{
    font-size: var(--fs-h6);
    line-height: var(--lh-h6);
    font-weight: 500;
    margin:0 0 14px;
    color: var(--content-primary);
  }
  /* Input Modal do DS: campos + 2 botões empilhados */
  .modal-box .form-field{ margin-bottom: 12px; }
  .modal-box .form-actions{ margin-top:18px; flex-direction: column; }
  .modal-step{ display:none; }
  .modal-step.active{ display:block; }
  .modal-step2-context{
    font-size: var(--fs-label-m);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--content-brand);
    margin-bottom: 14px;
  }

  @media (max-width: 767px){ /* abaixo do breakpoint md (768px) do DS */
    .app{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--border-secondary); max-height: 300px; }
    .main{ padding: 18px 16px 60px; }
    .form-grid{ grid-template-columns: 1fr; }
  }

  .toast{
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--bg-brand);
    color: var(--content-always-light);
    padding: 11px 16px;
    border-radius: var(--radius-2xs);
    font-size: var(--fs-label-l);
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translateY(8px);
    transition: all .2s;
    pointer-events:none;
    z-index: 60;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">QA - Lançamentos</span>
    </div>
    <h1 class="title">Mapa de Bugs</h1>
    <p class="subtitle">Dados compartilhados com todo o time.</p>

    <div class="reporter-row no-divider">
      <label for="reporterInput">Relator</label>
      <input id="reporterInput" placeholder="ex: Marina" />
    </div>

    <button class="btn block" id="newCompBtn">+ Novo Bug</button>

    <div class="sidebar-divider"></div>

    <div class="reporter-row no-divider" style="display:none;"><!-- oculto por ora -->
      <label for="compSearch">Páginas</label>
      <input class="comp-search" id="compSearch" placeholder="Buscar página..." />
    </div>
    <ul class="comp-list" id="compList"></ul>

    <button class="btn secondary small" id="newPageBtn" style="justify-content:center; margin-top:6px;">+ Nova página</button>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div class="page-heading-row">
        <h2 class="page-heading" id="pageHeading">Todas as páginas</h2>
        <button type="button" class="page-del-inline" id="deleteCurrentPageBtn" style="display:none;" title="Excluir página">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>
      <button class="btn secondary small" id="guideToggleBtn">
        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
        Guia rápido de teste
      </button>
    </div>

    <!-- All bugs view -->
    <div id="allBugsView">
      <div class="format-chip-bar" id="formatChipBar"></div>
      <div class="all-bugs-filters">
        <input id="allSearch" placeholder="Buscar por título, página ou relator..." style="flex:1; min-width:160px;" />
        <select id="allStatusFilter">
          <option value="">Todos os status</option>
          <option>Aberto</option>
          <option>Em andamento</option>
          <option>Resolvido</option>
        </select>
        <select id="allSevFilter">
          <option value="">Todas severidades</option>
          <option>Bloqueante</option>
          <option>Alta</option>
          <option>Média</option>
          <option>Baixa</option>
        </select>
      </div>
      <div id="allBugsList"></div>
    </div>
  </main>
</div>

<!-- Modal: novo bug — localiza/cria o mapeamento (Formato > Página > Componente) e já reporta o bug -->
<div class="modal-overlay" id="newCompModal">
  <div class="modal-box">
    <h3 id="newCompModalTitle">Novo Bug</h3>

    <!-- Passo 1: onde o bug acontece -->
    <div class="modal-step active" id="modalStep1">
      <div class="form-field">
        <label>Formato</label>
        <select id="newCompFormat">
          <option value="Web">Web</option>
          <option value="App">App</option>
        </select>
      </div>
      <div class="form-field">
        <label>Página</label>
        <select id="newCompPage">
          <option value="" disabled selected>Selecione a página</option>
        </select>
      </div>
      <div class="form-actions">
        <button class="btn block" id="modalStep1Next">Continuar</button>
        <button class="btn secondary block" id="cancelNewComp">Cancelar</button>
      </div>
    </div>

    <!-- Passo 2: detalhes do bug -->
    <div class="modal-step" id="modalStep2">
      <div class="modal-step2-context" id="modalStep2Context"></div>
      <div class="form-field">
        <label>Componente (opcional)</label>
        <input id="newCompComponent" placeholder="ex: Botão Continuar" />
      </div>
      <div class="form-field">
        <label>Título do bug</label>
        <input id="f_title" placeholder="ex: Botão Continuar fica ativo com e-mail inválido" />
      </div>
      <div class="form-field">
        <label>Descrição / passos para reproduzir</label>
        <textarea id="f_desc" placeholder="1. Vá até...&#10;2. Faça...&#10;3. Veja que..."></textarea>
      </div>
      <div class="form-field">
        <label>Severidade</label>
        <select id="f_sev">
          <option>Bloqueante</option>
          <option>Alta</option>
          <option>Média</option>
          <option>Baixa</option>
        </select>
      </div>
      <div class="form-field">
        <label>Print (opcional)</label>
        <input type="file" accept="image/*" id="newBugImage" />
        <div class="img-preview" id="newBugImagePreview"></div>
      </div>
      <div class="dup-warning" id="dupWarning"></div>
      <div class="form-actions">
        <button class="btn block" id="confirmNewComp">Salvar bug</button>
        <button class="btn secondary block" id="backToStep1">Voltar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: marcar como resolvido (texto obrigatório do que foi feito) -->
<div class="modal-overlay" id="resolveModal">
  <div class="modal-box">
    <h3 id="resolveModalTitle">Marcar como resolvido</h3>
    <div class="form-field">
      <label id="resolveModalLabel">O que foi feito</label>
      <textarea id="resolveNote" placeholder="Descreva a correção aplicada..."></textarea>
    </div>
    <div class="form-field">
      <label id="resolveByLabel">Resolvido por</label>
      <input id="resolveByInput" placeholder="ex: Marina" />
    </div>
    <div class="form-field">
      <label>Print (opcional)</label>
      <input type="file" accept="image/*" id="resolveImage" />
      <div class="img-preview" id="resolveImagePreview"></div>
    </div>
    <div class="form-actions">
      <button class="btn block" id="confirmResolve">Salvar</button>
      <button class="btn secondary block" id="cancelResolve">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal: nova página (exige senha) -->
<div class="modal-overlay" id="newPageModal">
  <div class="modal-box">
    <h3>Nova página</h3>

      <label>Nome da página</label>
      <input id="newPageName" placeholder="ex: Investimentos" />
    </div>
    <div class="form-field">
      <label>Senha</label>
      <input type="password" id="newPagePassword" placeholder="Senha pra criar página" />
    </div>
    <div class="form-actions">
      <button class="btn block" id="confirmNewPage">Criar página</button>
      <button class="btn secondary block" id="cancelNewPage">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal: excluir página (exige senha) -->
<div class="modal-overlay" id="deletePageModal">
  <div class="modal-box">

    <div class="form-field">
      <label>Senha</label>
      <input type="password" id="deletePagePassword" placeholder="Senha de exclusão" />
    </div>
    <div class="form-actions">
      <button class="btn block danger-solid" id="confirmDeletePage">Excluir página</button>
      <button class="btn secondary block" id="cancelDeletePage">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal: excluir bug (exige senha) -->
<div class="modal-overlay" id="deleteBugModal">

  </div>
</div>

  function downloadManual(){
    try{
      const byteChars = atob(MANUAL_PDF_BASE64);
      const byteNumbers = new Uint8Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      const blob = new Blob([byteNumbers], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'guia-rapido-de-teste-eqi.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('Guia baixado.');
    }catch(err){
      console.error(err);
      toast('Não consegui gerar o PDF.');
    }
  }

  }

    return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
  }

  function escapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function slugStatus(s){ return s.toLowerCase().replace(/\s+/g,'-').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 2200);
  }

  // ---------- Upload de imagem (opcional) ----------
  // Comprime no navegador antes de salvar, já que o armazenamento é
  // compartilhado por todo o time e guarda tudo num único bloco de texto.
  const MAX_IMAGE_DIMENSION = 1000;
  const MAX_IMAGE_CHARS = 1500000; // ~1.1MB depois de comprimido

  function fileToCompressedDataURL(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Falha ao ler a imagem'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Falha ao carregar a imagem'));
        img.onload = () => {
          let width = img.width, height = img.height;
          if(width > MAX_IMAGE_DIMENSION || height > MAX_IMAGE_DIMENSION){
            const scale = MAX_IMAGE_DIMENSION / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function renderImagePreview(previewId, dataUrl, onRemove){
    const box = document.getElementById(previewId);
    if(!dataUrl){
      box.classList.remove('show');
      box.innerHTML = '';
      return;
    }
    box.classList.add('show');
    box.innerHTML = `<img src="${dataUrl}" alt="Prévia do print" /><button type="button" class="img-preview-remove">Remover</button>`;
    box.querySelector('.img-preview-remove').addEventListener('click', onRemove);
  }

  // Abre uma imagem (data URL) em nova aba. Navegadores bloqueiam navegação
  // direta pra data: URLs via <a target="_blank">, então convertemos pra um
  // Blob e usamos a URL temporária dele, que abre normalmente.
  function openImageInNewTab(dataUrl){
    try{
      const [header, base64] = dataUrl.split(',');
      const mimeMatch = header.match(/data:(.*?);base64/);
      const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
      const byteChars = atob(base64);
      const byteNumbers = new Uint8Array(byteChars.length);
      for(let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      const blob = new Blob([byteNumbers], { type: mime });
      const blobUrl = URL.createObjectURL(blob);
      const win = window.open(blobUrl, '_blank');
      if(!win){
        toast('Não consegui abrir em nova aba — verifique o bloqueador de pop-up.');
      }
      setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
    }catch(err){
      console.error(err);
      toast('Não consegui abrir essa imagem.');
    }
  }

  // Confirmação de ações destrutivas feita dentro da própria UI: o diálogo
  // nativo confirm() é bloqueado no sandbox onde o artifact roda, então
  // usamos "clique de novo pra confirmar" em vez disso.
  function armDangerButton(btn, confirmLabel, action){
    if(btn.dataset.armed === '1'){
      clearTimeout(Number(btn.dataset.armTimer));
      action();
      return;
    }
    btn.dataset.armed = '1';
    btn.dataset.originalLabel = btn.textContent;
    btn.textContent = confirmLabel;
    btn.classList.add('confirming');
    const timer = setTimeout(() => {
      btn.dataset.armed = '0';
      btn.textContent = btn.dataset.originalLabel;
      btn.classList.remove('confirming');
    }, 3500);
    btn.dataset.armTimer = String(timer);
  }

  function normalizeTokens(text){
    const norm = String(text||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return norm.split(/[^a-z0-9]+/).filter(w => w.length > 2 && !STOPWORDS.has(w));
  }

  function jaccard(aTokens, bTokens){
    const a = new Set(aTokens), b = new Set(bTokens);
    if(a.size===0 || b.size===0) return 0;
    let inter = 0;
    for(const t of a) if(b.has(t)) inter++;
    const union = new Set([...a,...b]).size;
    return inter/union;
  }

  // Detecta o ambiente: dentro do Claude existe window.storage; fora (Vercel),
  // usamos a nossa própria API (/api/data), que guarda os dados num banco
  // real — assim trocar a versão do arquivo nunca apaga o histórico.
  const HAS_ARTIFACT_STORAGE = (typeof window !== 'undefined' && !!window.storage);

  async function loadAll(){
    try{
      if(HAS_ARTIFACT_STORAGE){
        const res = await window.storage.get(STORE_KEY, true);
        state.data = res && res.value ? JSON.parse(res.value) : { components: [], bugs: [] };
      } else {
        const r = await fetch('/api/data');
        state.data = r.ok ? await r.json() : { components: [], bugs: [] };
      }
    }catch(e){
      console.error('Falha ao carregar dados', e);
      state.data = { components: [], bugs: [] };
    }
    // Migração: dados salvos antes da lista de páginas ser dinâmica
    if(!Array.isArray(state.data.pages) || state.data.pages.length === 0){
      state.data.pages = ['Minhas finanças', 'EQI Research'];
      await persistData();
    }
    try{
      state.reporterName = localStorage.getItem(REPORTER_KEY) || '';
    }catch(e){ state.reporterName = ''; }
    document.getElementById('reporterInput').value = state.reporterName;
    populatePageSelect();
  }

  function populatePageSelect(){
    const sel = document.getElementById('newCompPage');
    const current = sel.value;
    sel.innerHTML = '<option value="" disabled selected>Selecione a página</option>' +
      state.data.pages.map(p => `<option>${escapeHtml(p)}</option>`).join('');
    if(current && state.data.pages.includes(current)) sel.value = current;
  }

  async function persistData(){
    try{
      if(HAS_ARTIFACT_STORAGE){
        await window.storage.set(STORE_KEY, JSON.stringify(state.data), true);
      } else {
        const r = await fetch('/api/data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state.data),
        });
        if(!r.ok) throw new Error('resposta não OK da API');
      }
    }catch(e){
      console.error('Falha ao salvar dados', e);
      toast('Não consegui salvar. Tente de novo.');
    }
  }

  async function persistReporter(name){
    state.reporterName = name;
    try{ localStorage.setItem(REPORTER_KEY, name); }
    catch(e){ console.error('Falha ao salvar nome', e); }
  }

  function bugsFor(componentId){
    return state.data.bugs.filter(b => b.componentId === componentId);
  }

  // ---------- Sidebar render ----------
  function openBugCountForPage(page, format){
    return state.data.bugs.filter(b => {
      if(b.status === 'Resolvido' || b.status === 'Não existente') return false;
      const comp = state.data.components.find(c => c.id === b.componentId);
      return comp && comp.page === page && (!format || comp.format === format);
    }).length;
  }

  function renderSidebar(){
    const list = document.getElementById('compList');
    const q = document.getElementById('compSearch').value.trim().toLowerCase();
    const pages = state.data.pages
      .filter(p => !q || p.toLowerCase().includes(q))
      .map(p => ({ name: p, count: openBugCountForPage(p) }))
      .sort((a,b) => b.count - a.count || a.name.localeCompare(b.name));

    const totalAll = state.data.bugs.filter(b => b.status !== 'Resolvido' && b.status !== 'Não existente').length;
    const allActive = !state.selectedPage ? 'active' : '';
    const allCountCls = totalAll === 0 ? 'zero' : '';
    let html = `<li class="comp-item ${allActive}" data-page="">
      <span class="comp-name">Todas as páginas</span>
      <span class="comp-count ${allCountCls}">${totalAll}</span>
    </li>`;

    if(pages.length === 0){
      html += '<li class="empty-comps">Nenhuma página encontrada.</li>';
      list.innerHTML = html;
    } else {
      html += pages.map(({name: page, count: total}) => {
        const active = page === state.selectedPage ? 'active' : '';
        const countCls = total === 0 ? 'zero' : '';
        return `<li class="comp-item ${active}" data-page="${escapeHtml(page)}">
          <span class="comp-name">${escapeHtml(page)}</span>
          <span class="comp-count ${countCls}">${total}</span>
        </li>`;
      }).join('');
      list.innerHTML = html;
    }

    // Clicar no nome da página (ou em "Todas as páginas") filtra "Todos os bugs"
    list.querySelectorAll('.comp-item').forEach(el => {
      el.addEventListener('click', () => {
        const page = el.dataset.page;
        state.selectedPage = page || null;
        state.formatFilter = '';
        document.getElementById('allSearch').value = page || '';
        renderSidebar();
        renderAllBugsView();
      });
    });
  }

  function renderBugCard(bug){
    const sevSlug = 'sev-' + bug.severity.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const statusSlug = slugStatus(bug.status);
    const comp = state.data.components.find(c => c.id === bug.componentId);
    const pageLabel = comp ? `${comp.page} - ${comp.format.toUpperCase()}` : '(página removida)';
    return `
      <div class="bug-card ${sevSlug} status-${statusSlug}" data-bugid="${bug.id}">
        <div class="bug-top">
          <div>
            <div class="bug-title-row">
              <span class="badge ${sevSlug}">${escapeHtml(bug.severity)}</span>
              <span class="bug-title" data-toggle="${bug.id}">${escapeHtml(bug.title)}</span>
            </div>
            <div class="comp-tag">${escapeHtml(pageLabel)}</div>
            <div class="bug-meta">${escapeHtml(bug.reporter||'anônimo')} · ${new Date(bug.createdAt).toLocaleDateString('pt-BR')} · <b>${escapeHtml(bug.status)}</b></div>
          </div>
          <div class="bug-actions">
            <select class="status-select" data-bugid="${bug.id}">
              ${STATUSES.map(s=>`<option ${s===bug.status?'selected':''}>${s}</option>`).join('')}
            </select>
            <button type="button" class="btn small secondary edit-bug" data-bugid="${bug.id}">Editar</button>
            <button type="button" class="btn small danger del-bug" data-bugid="${bug.id}">Excluir</button>
          </div>
        </div>
        <div class="bug-body" id="body-${bug.id}">
          <div class="field-label">Descrição / passos</div>
          <p>${escapeHtml(bug.description || '(sem descrição)')}</p>
          ${bug.image ? `
          <div class="field-label">Print do bug</div>
          <div class="bug-image-attachment" data-bugid="${bug.id}" data-field="image"><img src="${bug.image}" alt="Print do bug" /></div>
          ` : ''}
          ${bug.resolution ? `
          <div class="field-label">O que foi feito (resolução)${bug.resolvedBy ? ' · por ' + escapeHtml(bug.resolvedBy) : ''}</div>
          <p>${escapeHtml(bug.resolution)}</p>
          ` : ''}
          ${bug.resolutionImage ? `
          <div class="bug-image-attachment" data-bugid="${bug.id}" data-field="resolutionImage"><img src="${bug.resolutionImage}" alt="Print da resolução" /></div>
          ` : ''}
          ${bug.notExistsReason ? `
          <div class="field-label">Motivo (não existente)${bug.notExistsBy ? ' · por ' + escapeHtml(bug.notExistsBy) : ''}</div>
          <p>${escapeHtml(bug.notExistsReason)}</p>
          ` : ''}
          ${bug.notExistsImage ? `
          <div class="bug-image-attachment" data-bugid="${bug.id}" data-field="notExistsImage"><img src="${bug.notExistsImage}" alt="Print do motivo" /></div>
          ` : ''}
        </div>
      </div>
    `;
  }

  // ---------- Duplicidade dentro do modal "Novo Bug" ----------
  function currentModalComp(){
    const format = document.getElementById('newCompFormat').value;
    const page = document.getElementById('newCompPage').value;
    const component = document.getElementById('newCompComponent').value.trim().toLowerCase();
    if(!page) return null;
    return state.data.components.find(c =>
      c.format === format && c.page === page && (c.component||'').trim().toLowerCase() === component
    ) || null;
  }

  function checkDuplicatesInModal(){
    const dupBox = document.getElementById('dupWarning');
    const comp = currentModalComp();
    if(!comp){ dupBox.classList.remove('show'); return; }

    const title = document.getElementById('f_title').value;
    const desc = document.getElementById('f_desc').value;
    const tokens = normalizeTokens(title + ' ' + desc);
    if(tokens.length < 2){ dupBox.classList.remove('show'); return; }

    const candidates = bugsFor(comp.id)
      .filter(b => b.status !== 'Resolvido' && b.status !== 'Não existente')
      .filter(b => b.id !== editingBugId)
      .map(b => ({ bug: b, score: jaccard(tokens, normalizeTokens(b.title + ' ' + b.description)) }))
      .filter(x => x.score > 0.22)
      .sort((a,b)=> b.score - a.score)
      .slice(0,3);

    if(candidates.length === 0){ dupBox.classList.remove('show'); return; }

    dupBox.innerHTML = '<strong>Atenção — pode já existir um bug parecido nesse mapeamento:</strong>' +
      candidates.map(c => `<div class="dup-item" data-jump="${escapeHtml(c.bug.title)}">${escapeHtml(c.bug.title)} <span class="comp-tag">(${c.bug.status})</span></div>`).join('');
    dupBox.classList.add('show');
    dupBox.querySelectorAll('.dup-item').forEach(el => {
      el.addEventListener('click', () => {
        newCompModal.classList.remove('open');
        clearModalForm();
        document.getElementById('allSearch').value = el.dataset.jump;
        renderAllBugsView();
      });
    });
  }

  function clearModalForm(){
    document.getElementById('newCompFormat').value = 'Web';
    document.getElementById('newCompPage').value = '';
    document.getElementById('newCompComponent').value = '';
    document.getElementById('f_title').value = '';
    document.getElementById('f_desc').value = '';
    document.getElementById('f_sev').value = 'Bloqueante';
    document.getElementById('dupWarning').classList.remove('show');
    document.getElementById('newBugImage').value = '';
    pendingNewBugImage = null;
    renderImagePreview('newBugImagePreview', null);
    editingBugId = null;
    document.getElementById('newCompModalTitle').textContent = 'Novo Bug';
    document.getElementById('confirmNewComp').textContent = 'Salvar bug';
  }

  function openEditBugModal(bugId){
    const bug = state.data.bugs.find(b => b.id === bugId);
    if(!bug) return;
    const comp = state.data.components.find(c => c.id === bug.componentId);
    editingBugId = bugId;

    document.getElementById('newCompFormat').value = comp ? comp.format : 'Web';
    document.getElementById('newCompPage').value = comp ? comp.page : '';
    document.getElementById('newCompComponent').value = comp ? (comp.component || '') : '';
    document.getElementById('f_title').value = bug.title || '';
    document.getElementById('f_desc').value = bug.description || '';
    document.getElementById('f_sev').value = bug.severity || 'Bloqueante';
    document.getElementById('dupWarning').classList.remove('show');

    document.getElementById('newBugImage').value = '';
    pendingNewBugImage = bug.image || null;
    renderImagePreview('newBugImagePreview', pendingNewBugImage, () => {
      pendingNewBugImage = null;
      document.getElementById('newBugImage').value = '';
      renderImagePreview('newBugImagePreview', null);
    });

    document.getElementById('newCompModalTitle').textContent = 'Editar bug';
    document.getElementById('confirmNewComp').textContent = 'Salvar alterações';
    if(comp) document.getElementById('modalStep2Context').textContent = `${comp.format} · ${comp.page}`;

    newCompModal.classList.add('open');
    showModalStep(2);
    document.getElementById('f_title').focus();
  }

  // ---------- All bugs view ----------
  function renderAllBugsView(){
    document.getElementById('pageHeading').textContent = state.selectedPage || 'Todas as páginas';
    document.getElementById('deleteCurrentPageBtn').style.display = state.selectedPage ? 'inline-flex' : 'none';

    const wrap = document.getElementById('allBugsList');
    const q = document.getElementById('allSearch').value.trim().toLowerCase();
    const statusF = document.getElementById('allStatusFilter').value;
    const sevF = document.getElementById('allSevFilter').value;

    let baseBugs = state.data.bugs.slice().sort((a,b) => {
      const aClosed = (a.status === 'Resolvido' || a.status === 'Não existente') ? 1 : 0;
      const bClosed = (b.status === 'Resolvido' || b.status === 'Não existente') ? 1 : 0;
      if(aClosed !== bClosed) return aClosed - bClosed;
      return b.createdAt - a.createdAt;
    });
    if(q) baseBugs = baseBugs.filter(b => {
      const comp = state.data.components.find(c => c.id === b.componentId);
      const pageText = comp ? comp.page.toLowerCase() : '';
      const reporterText = (b.reporter || '').toLowerCase();
      return b.title.toLowerCase().includes(q) || pageText.includes(q) || reporterText.includes(q);
    });
    if(statusF) baseBugs = baseBugs.filter(b => b.status === statusF);
    if(sevF) baseBugs = baseBugs.filter(b => b.severity === sevF);

    // Barra de chips Web/App com contagem — reflete a página/busca atual,
    // então funciona tanto ao entrar numa página quanto em "Todos os bugs"
    const webCount = baseBugs.filter(b => {
      const comp = state.data.components.find(c => c.id === b.componentId);
      return comp && comp.format === 'Web';
    }).length;
    const appCount = baseBugs.filter(b => {
      const comp = state.data.components.find(c => c.id === b.componentId);
      return comp && comp.format === 'App';
    }).length;
    const chipBar = document.getElementById('formatChipBar');
    chipBar.innerHTML = `
      <button type="button" class="fmt-chip-btn ${state.formatFilter === '' ? 'active' : ''}" data-format="">Todos <b>${baseBugs.length}</b></button>
      <button type="button" class="fmt-chip-btn ${state.formatFilter === 'Web' ? 'active' : ''}" data-format="Web">Web <b>${webCount}</b></button>
      <button type="button" class="fmt-chip-btn ${state.formatFilter === 'App' ? 'active' : ''}" data-format="App">App <b>${appCount}</b></button>
    `;
    chipBar.querySelectorAll('.fmt-chip-btn').forEach(el => {
      el.addEventListener('click', () => {
        state.formatFilter = el.dataset.format;
        renderAllBugsView();
      });
    });

    let bugs = baseBugs;
    if(state.formatFilter) bugs = bugs.filter(b => {
      const comp = state.data.components.find(c => c.id === b.componentId);
      return comp && comp.format === state.formatFilter;
    });

    if(bugs.length === 0){
      wrap.innerHTML = '<div class="empty-state">Nenhum bug encontrado. Use "+ Novo Bug" pra registrar o primeiro.</div>';
      return;
    }

    wrap.innerHTML = bugs.map(b => renderBugCard(b)).join('');

    wrap.querySelectorAll('.bug-title').forEach(el => {
      el.addEventListener('click', () => document.getElementById('body-' + el.dataset.toggle).classList.toggle('open'));
    });
    wrap.querySelectorAll('.bug-image-attachment').forEach(el => {
      el.addEventListener('click', () => {
        const bug = state.data.bugs.find(b => b.id === el.dataset.bugid);
        if(!bug) return;
        const dataUrl = bug[el.dataset.field];
        if(dataUrl) openImageInNewTab(dataUrl);
      });
    });
    wrap.querySelectorAll('.status-select').forEach(el => {
      el.addEventListener('change', async () => {
        const bug = state.data.bugs.find(b => b.id === el.dataset.bugid);
        if(!bug) return;
        if(el.value === 'Resolvido' || el.value === 'Não existente'){
          openStatusNoteModal(bug, el.value);
        } else {
          bug.status = el.value;
          await persistData();
          renderAll();
          toast('Status atualizado.');
        }
      });
    });
    wrap.querySelectorAll('.edit-bug').forEach(el => {
      el.addEventListener('click', () => openEditBugModal(el.dataset.bugid));
    });
    wrap.querySelectorAll('.del-bug').forEach(el => {
      el.addEventListener('click', () => openDeleteBugModal(el.dataset.bugid));
    });
  }

  // ---------- Top-level render ----------
  function renderAll(){
    renderSidebar();
    renderAllBugsView();
  }

  // ---------- Static events ----------
  document.getElementById('compSearch').addEventListener('input', renderSidebar);
  document.getElementById('allSearch').addEventListener('input', renderAllBugsView);
  document.getElementById('allStatusFilter').addEventListener('change', renderAllBugsView);
  document.getElementById('allSevFilter').addEventListener('change', renderAllBugsView);
  document.getElementById('guideToggleBtn').addEventListener('click', downloadManual);
  document.getElementById('deleteCurrentPageBtn').addEventListener('click', () => {
    if(state.selectedPage) openDeletePageModal(state.selectedPage);
  });

  document.getElementById('reporterInput').addEventListener('change', (e) => {
    persistReporter(e.target.value.trim());
  });

  // ---------- Modal: marcar como resolvido / não existente ----------
  const resolveModal = document.getElementById('resolveModal');
  let pendingStatusBugId = null;
  let pendingStatus = null;
  let pendingResolveImage = null;

  const STATUS_NOTE_CONFIG = {
    'Resolvido': {
      title: 'Marcar como resolvido',
      label: 'O que foi feito',
      placeholder: 'Descreva a correção aplicada...',
      field: 'resolution',
      atField: 'resolvedAt',
      imageField: 'resolutionImage',
      byLabel: 'Resolvido por',
      byField: 'resolvedBy',
      emptyMsg: 'Descreva o que foi feito antes de salvar.',
      doneMsg: 'Bug marcado como resolvido.',
    },
    'Não existente': {
      title: 'Marcar como não existente',
      label: 'Por que não existe',
      placeholder: 'Descreva o motivo (não reproduziu, duplicado, comportamento esperado...)',
      field: 'notExistsReason',
      atField: 'notExistsAt',
      imageField: 'notExistsImage',
      byLabel: 'Marcado por',
      byField: 'notExistsBy',
      emptyMsg: 'Descreva o motivo antes de salvar.',
      doneMsg: 'Bug marcado como não existente.',
    },
  };

  function openStatusNoteModal(bug, status){
    const cfg = STATUS_NOTE_CONFIG[status];
    pendingStatusBugId = bug.id;
    pendingStatus = status;
    document.getElementById('resolveModalTitle').textContent = cfg.title;
    document.getElementById('resolveModalLabel').textContent = cfg.label;
    const noteEl = document.getElementById('resolveNote');
    noteEl.placeholder = cfg.placeholder;
    noteEl.value = bug[cfg.field] || '';
    document.getElementById('resolveByLabel').textContent = cfg.byLabel;
    document.getElementById('resolveByInput').value = bug[cfg.byField] || state.reporterName || '';
    document.getElementById('resolveImage').value = '';
    pendingResolveImage = bug[cfg.imageField] || null;
    renderImagePreview('resolveImagePreview', pendingResolveImage, () => {
      pendingResolveImage = null;
      document.getElementById('resolveImage').value = '';
      renderImagePreview('resolveImagePreview', null);
    });
    resolveModal.classList.add('open');
    noteEl.focus();
  }

  document.getElementById('resolveImage').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await fileToCompressedDataURL(file);
      if(dataUrl.length > MAX_IMAGE_CHARS){
        toast('Imagem muito grande mesmo após compactar. Tente outra.');
        e.target.value = '';
        return;
      }
      pendingResolveImage = dataUrl;
      renderImagePreview('resolveImagePreview', pendingResolveImage, () => {
        pendingResolveImage = null;
        document.getElementById('resolveImage').value = '';
        renderImagePreview('resolveImagePreview', null);
      });
    }catch(err){
      console.error(err);
      toast('Não consegui processar essa imagem.');
    }
  });

  document.getElementById('cancelResolve').addEventListener('click', () => {
    pendingStatusBugId = null;
    pendingStatus = null;
    pendingResolveImage = null;
    resolveModal.classList.remove('open');
    renderAll(); // reverte o select de volta pro status real, já que a mudança não foi salva
  });

  document.getElementById('confirmResolve').addEventListener('click', async () => {
    const cfg = STATUS_NOTE_CONFIG[pendingStatus];
    const note = document.getElementById('resolveNote').value.trim();
    const byName = document.getElementById('resolveByInput').value.trim();
    if(!note){ toast(cfg.emptyMsg); return; }
    if(!byName){ toast(`Preencha "${cfg.byLabel}" antes de salvar.`); document.getElementById('resolveByInput').focus(); return; }
    const bug = state.data.bugs.find(b => b.id === pendingStatusBugId);
    if(bug){
      bug.status = pendingStatus;
      bug[cfg.field] = note;
      bug[cfg.atField] = Date.now();
      bug[cfg.imageField] = pendingResolveImage || null;
      bug[cfg.byField] = byName;
      await persistData();
    }
    pendingStatusBugId = null;
    pendingStatus = null;
    pendingResolveImage = null;
    resolveModal.classList.remove('open');
    renderAll();
    toast(cfg.doneMsg);
  });

  // ---------- Modal: excluir bug (exige senha) ----------
  // ---------- Modal: nova página (exige senha) ----------
  const CREATE_PAGE_PASSWORD = 'EQI@2025';
  const newPageModal = document.getElementById('newPageModal');

  document.getElementById('newPageBtn').addEventListener('click', () => {
    document.getElementById('newPageName').value = '';
    document.getElementById('newPagePassword').value = '';
    newPageModal.classList.add('open');
    document.getElementById('newPageName').focus();
  });

  document.getElementById('cancelNewPage').addEventListener('click', () => {
    newPageModal.classList.remove('open');
  });

  document.getElementById('confirmNewPage').addEventListener('click', async () => {
    const name = document.getElementById('newPageName').value.trim();
    const pwd = document.getElementById('newPagePassword').value;
    if(!name){ toast('Dá um nome pra página.'); return; }
    if(pwd !== CREATE_PAGE_PASSWORD){
      toast('Senha incorreta.');
      document.getElementById('newPagePassword').value = '';
      document.getElementById('newPagePassword').focus();
      return;
    }
    const exists = state.data.pages.some(p => p.toLowerCase() === name.toLowerCase());
    if(exists){ toast('Essa página já existe.'); return; }

    state.data.pages.push(name);
    await persistData();
    newPageModal.classList.remove('open');
    populatePageSelect();
    renderAll();
    toast('Página criada.');
  });

  ['newPageName','newPagePassword'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', (e) => {
      if(e.key === 'Enter') document.getElementById('confirmNewPage').click();
    });
  });

  // ---------- Modal: excluir página (exige senha) ----------
  const deletePageModal = document.getElementById('deletePageModal');
  let pendingDeletePage = null;

  function openDeletePageModal(pageName){
    pendingDeletePage = pageName;
    const bugCount = state.data.bugs.filter(b => {
      const comp = state.data.components.find(c => c.id === b.componentId);
      return comp && comp.page === pageName;
    }).length;
    document.getElementById('deletePageWarning').textContent =
      `Isso vai apagar a página "${pageName}" e todos os ${bugCount} bug${bugCount===1?'':'s'} relacionados a ela. Essa ação não pode ser desfeita. Digite a senha pra confirmar.`;
    document.getElementById('deletePagePassword').value = '';
    deletePageModal.classList.add('open');
    document.getElementById('deletePagePassword').focus();
  }

  document.getElementById('cancelDeletePage').addEventListener('click', () => {
    pendingDeletePage = null;
    deletePageModal.classList.remove('open');
  });

  document.getElementById('confirmDeletePage').addEventListener('click', async () => {
    const pwd = document.getElementById('deletePagePassword').value;
    if(pwd !== CREATE_PAGE_PASSWORD){
      toast('Senha incorreta.');
      document.getElementById('deletePagePassword').value = '';
      document.getElementById('deletePagePassword').focus();
      return;
    }
    const pageName = pendingDeletePage;
    const compIdsToRemove = state.data.components.filter(c => c.page === pageName).map(c => c.id);
    state.data.bugs = state.data.bugs.filter(b => !compIdsToRemove.includes(b.componentId));
    state.data.components = state.data.components.filter(c => c.page !== pageName);
    state.data.pages = state.data.pages.filter(p => p !== pageName);
    await persistData();

    if(state.selectedPage === pageName){
      state.selectedPage = null;
      document.getElementById('allSearch').value = '';
    }
    pendingDeletePage = null;
    deletePageModal.classList.remove('open');
    populatePageSelect();
    renderAll();
    toast('Página excluída.');
  });

  document.getElementById('deletePagePassword').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') document.getElementById('confirmDeletePage').click();
  });

  const DELETE_PASSWORD = 'EQI@2025';
  const deleteBugModal = document.getElementById('deleteBugModal');
  let pendingDeleteBugId = null;

  function openDeleteBugModal(bugId){
    pendingDeleteBugId = bugId;
    document.getElementById('deleteBugPassword').value = '';
    deleteBugModal.classList.add('open');
    document.getElementById('deleteBugPassword').focus();
  }

  document.getElementById('cancelDeleteBug').addEventListener('click', () => {
    pendingDeleteBugId = null;
    deleteBugModal.classList.remove('open');
  });

  document.getElementById('confirmDeleteBug').addEventListener('click', async () => {
    const pwd = document.getElementById('deleteBugPassword').value;
    if(pwd !== DELETE_PASSWORD){
      toast('Senha incorreta.');
      document.getElementById('deleteBugPassword').value = '';
      document.getElementById('deleteBugPassword').focus();
      return;
    }
    state.data.bugs = state.data.bugs.filter(b => b.id !== pendingDeleteBugId);
    await persistData();
    pendingDeleteBugId = null;
    deleteBugModal.classList.remove('open');
    renderAll();
    toast('Bug excluído.');
  });

  document.getElementById('deleteBugPassword').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') document.getElementById('confirmDeleteBug').click();
  });

  const newCompModal = document.getElementById('newCompModal');

  function showModalStep(n){
    document.getElementById('modalStep1').classList.toggle('active', n === 1);
    document.getElementById('modalStep2').classList.toggle('active', n === 2);
  }

  document.getElementById('newCompBtn').addEventListener('click', () => {
    const reporterName = document.getElementById('reporterInput').value.trim();
    if(!reporterName){
      toast('Preencha seu nome em "Relator" antes de criar um bug.');
      document.getElementById('reporterInput').focus();
      return;
    }
    clearModalForm();
    showModalStep(1);
    newCompModal.classList.add('open');
    document.getElementById('newCompPage').focus();
  });
  document.getElementById('cancelNewComp').addEventListener('click', () => { newCompModal.classList.remove('open'); clearModalForm(); });

  document.getElementById('modalStep1Next').addEventListener('click', () => {
    const format = document.getElementById('newCompFormat').value;
    const page = document.getElementById('newCompPage').value;
    if(!page){ toast('Selecione a página.'); return; }
    document.getElementById('modalStep2Context').textContent = `${format} · ${page}`;
    showModalStep(2);
    document.getElementById('f_title').focus();
    checkDuplicatesInModal();
  });
  document.getElementById('newCompPage').addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('modalStep1Next').click(); }
  });
  document.getElementById('backToStep1').addEventListener('click', () => showModalStep(1));

  ['newCompFormat','newCompPage','newCompComponent'].forEach(id => {
    document.getElementById(id).addEventListener('input', checkDuplicatesInModal);
    document.getElementById(id).addEventListener('change', checkDuplicatesInModal);
  });
  document.getElementById('f_title').addEventListener('input', checkDuplicatesInModal);
  document.getElementById('f_desc').addEventListener('input', checkDuplicatesInModal);

  document.getElementById('newBugImage').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await fileToCompressedDataURL(file);
      if(dataUrl.length > MAX_IMAGE_CHARS){
        toast('Imagem muito grande mesmo após compactar. Tente outra.');
        e.target.value = '';
        return;
      }
      pendingNewBugImage = dataUrl;
      renderImagePreview('newBugImagePreview', pendingNewBugImage, () => {
        pendingNewBugImage = null;
        document.getElementById('newBugImage').value = '';
        renderImagePreview('newBugImagePreview', null);
      });
    }catch(err){
      console.error(err);
      toast('Não consegui processar essa imagem.');
    }
  });

  document.getElementById('confirmNewComp').addEventListener('click', async () => {
    const format = document.getElementById('newCompFormat').value;
    const page = document.getElementById('newCompPage').value;
    const component = document.getElementById('newCompComponent').value.trim();
    const title = document.getElementById('f_title').value.trim();
    if(!page){ toast('Selecione a página.'); showModalStep(1); return; }
    if(!title){ toast('Dá um título pro bug.'); return; }

    // Reaproveita o mapeamento se format+página+componente já existir, em vez de duplicar na sidebar
    const normComponent = component.toLowerCase();
    let comp = state.data.components.find(c =>
      c.format === format && c.page === page && (c.component||'').trim().toLowerCase() === normComponent
    );
    if(!comp){
      comp = { id: uid(), format, page, component, createdAt: Date.now() };
      state.data.components.push(comp);
    }

    if(editingBugId){
      // Modo edição: atualiza o bug existente, sem mexer em relator/status/histórico
      const bug = state.data.bugs.find(b => b.id === editingBugId);
      if(!bug){ toast('Esse bug não existe mais.'); newCompModal.classList.remove('open'); return; }
      bug.componentId = comp.id;
      bug.title = title;
      bug.description = document.getElementById('f_desc').value.trim();
      bug.severity = document.getElementById('f_sev').value;
      bug.image = pendingNewBugImage || null;
      await persistData();

      newCompModal.classList.remove('open');
      clearModalForm();
      state.selectedPage = comp.page;
      document.getElementById('allSearch').value = '';
      renderAll();
      toast('Bug atualizado.');
      return;
    }

    const reporterName = document.getElementById('reporterInput').value.trim();
    if(!reporterName){ toast('Preencha seu nome em "Relator" antes de criar um bug.'); newCompModal.classList.remove('open'); document.getElementById('reporterInput').focus(); return; }

    const bug = {
      id: uid(),
      componentId: comp.id,
      title,
      description: document.getElementById('f_desc').value.trim(),
      severity: document.getElementById('f_sev').value,
      status: 'Aberto',
      reporter: reporterName,
      createdAt: Date.now(),
      image: pendingNewBugImage || null,
    };
    state.data.bugs.push(bug);
    await persistData();

    newCompModal.classList.remove('open');
    clearModalForm();
    state.selectedPage = comp.page;
    document.getElementById('allSearch').value = '';
    renderAll();
    toast('Bug registrado.');
  });

  // ---------- Init ----------
  (async function init(){
    await loadAll();

    // Limpeza única — remove os bugs de "Minhas finanças". Sem botão,
    // roda sozinho na primeira abertura depois desta atualização.
    const beforeCount = state.data.bugs.length;
    state.data.bugs = state.data.bugs.filter(b => {
      const comp = state.data.components.find(c => c.id === b.componentId);
      return !(comp && comp.page === 'Minhas finanças');
    });
    if(state.data.bugs.length !== beforeCount){
      await persistData();
    }

    renderAll();
  })();
})();
</script>
</body>
</html>
